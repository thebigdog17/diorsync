services:
  - type: web
    name: diorsync-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: diorsync-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://diorsync-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
